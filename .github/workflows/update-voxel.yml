name: Update contribution landscape

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: voxel-landscape
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render public contribution calendar
        run: python3 scripts/render_voxel_contributions.py
      - name: Commit changed image
        run: |
          if git diff --quiet -- assets/voxel-contributions.svg; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/voxel-contributions.svg
          git commit -m 'Update contribution landscape'
          git push
